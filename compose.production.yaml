name: ai-engineering-control-plane

x-control-plane: &control-plane
  restart: unless-stopped
  env_file:
    - path: ${CONTROL_PLANE_ENV_FILE:-.env.production}
      required: true
  networks:
    - backend
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  migrate:
    <<: *control-plane
    image: ${CONTROL_PLANE_API_IMAGE:?set a digest-pinned API image}
    restart: "no"
    command: ["alembic", "-c", "/app/alembic.ini", "upgrade", "head"]
    volumes:
      - ./alembic.ini:/app/alembic.ini:ro
      - ./migrations:/app/migrations:ro

  api:
    <<: *control-plane
    image: ${CONTROL_PLANE_API_IMAGE:?set a digest-pinned API image}
    command:
      - uvicorn
      - control_plane.api:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --proxy-headers
      - --forwarded-allow-ips
      - "*"
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./deployment/policies:/run/control-plane/policies:ro
    expose:
      - "8000"

  worker:
    <<: *control-plane
    image: ${CONTROL_PLANE_WORKER_IMAGE:?set a digest-pinned worker image}
    depends_on:
      migrate:
        condition: service_completed_successfully
    group_add:
      - ${DOCKER_GID:?set the container-engine socket group id}
    volumes:
      - ./deployment/policies:/run/control-plane/policies:ro
      - ${CONTROL_PLANE_PROJECTS_ROOT:?set the operator project root}:/projects
      - control-plane-worktrees:/workspaces
      - /var/run/docker.sock:/var/run/docker.sock

  ingress:
    image: ${CADDY_IMAGE:?set a digest-pinned Caddy image}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      ACME_EMAIL: ${ACME_EMAIL:?set the ACME account email}
      CONTROL_PLANE_DOMAIN: ${CONTROL_PLANE_DOMAIN:?set the public DNS name}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    networks:
      - edge
      - backend
    read_only: true
    tmpfs:
      - /config:size=16m,mode=0700
    volumes:
      - ./deployment/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

networks:
  edge:
  backend:
    internal: true

volumes:
  caddy-data:
  control-plane-worktrees:
